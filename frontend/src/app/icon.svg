<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-arc" x1="4" y1="16" x2="28" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="fav-iris" x1="10" y1="10" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <!-- Dark Base Badge for Tab Contrast -->
  <rect width="32" height="32" rx="7" fill="#0B132B" />

  <!-- Upper Orbital Wing -->
  <path d="M 4,16 C 4,9 9.5,4.5 16,4.5 C 22.5,4.5 28,9 28,16 C 25.2,10.5 21,7.8 16,7.8 C 11,7.8 6.8,10.5 4,16 Z" fill="url(#fav-arc)" />

  <!-- Lower Orbital Wing -->
  <path d="M 4,16 C 4,23 9.5,27.5 16,27.5 C 22.5,27.5 28,23 28,16 C 25.2,21.5 21,24.2 16,24.2 C 11,24.2 6.8,21.5 4,16 Z" fill="url(#fav-arc)" />

  <!-- Central Iris Ring -->
  <circle cx="16" cy="16" r="5.2" fill="none" stroke="url(#fav-iris)" stroke-width="2" />

  <!-- Priority Reticle Core -->
  <path d="M 16,12.5 L 19,16 L 16,19.5 L 13,16 Z" fill="#38BDF8" />

  <!-- Center Pupil Node -->
  <circle cx="16" cy="16" r="1.2" fill="#FFFFFF" />
</svg>
